<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El oráculo de los números</title>
    <!-- Criterio cumplido: carga con defer -->
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Misión 1 🔮 El oráculo de los números</h1>
    <p>Adivina el número secreto entre 1 y 100.</p>

    <div>
        <input type="number" id="numeroInput" placeholder="Tu número (1-100)">
        <button id="adivinarBtn">Consultar al oráculo</button>
        <!-- Reto: Botón para reiniciar (oculto al principio) -->
        <button id="reiniciarBtn" hidden>Nueva profecía</button>
    </div>

    <p id="mensaje"></p>
    <p id="marcador">Intentos: 0 / 7</p>
    <!-- Reto: Párrafo para el historial -->
    <p id="historial"></p>
</body>
</html>
